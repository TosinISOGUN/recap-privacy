name: Notify IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages here deploys from the branch directly (classic pipeline), not
# via Actions, so this workflow only has to notify search engines — nothing
# to build or deploy. Notifies IndexNow (Bing, Yandex, Seznam, etc. — not
# Google) that the live URLs changed, so they crawl the fresh content instead
# of waiting for their own schedule. Reads the URL list from the committed
# sitemap (source of truth, avoids CDN cache). The key is public by design —
# it's also hosted at /<key>.txt so IndexNow can verify domain ownership.
jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Submit URLs to IndexNow
        env:
          INDEXNOW_KEY: 3f914a4c832c29466dae3447b5681b29
        run: |
          urls=$(grep -oP '(?<=<loc>)[^<]+' sitemap.xml)
          echo "Submitting $(echo "$urls" | wc -l) URLs to IndexNow:"
          echo "$urls"
          payload=$(printf '%s\n' "$urls" | jq -R . | jq -s \
            --arg key "$INDEXNOW_KEY" \
            '{host:"recap.isogunlabs.com", key:$key, keyLocation:("https://recap.isogunlabs.com/"+$key+".txt"), urlList:.}')
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload" -w "\nIndexNow HTTP status: %{http_code}\n"
